<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Interactivity Practice</title>
  <link rel="stylesheet" href="swsw.css" />
</head>
<body>
  <h1>JS Events & Interactivity</h1>
  <button id="clickBtn">Click here</button>
  <div id="hoverBox">Hover </div>
  <p>Type something: <input type="text" id="keyInput" /></p>

  <!-- 2. Interactive Elements -->
  <button id="toggleTextBtn">Toggle Text</button>
  <p id="toggleText" style="display: none;">Hello, I'm now visible!</p>

  <!-- 3. Form Validation -->
  <form id="sampleForm">
    <input type="text" id="email" placeholder="Email" required /><br />
    <input type="password" id="password" placeholder="Password" required /><br />
    <button type="submit">Submit</button>
    <p id="formFeedback"></p>
  </form>

  <script src="script.js"></script>
</body>
</html>
